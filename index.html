nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
nav button{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}

.map{background:var(--map);border:1px solid var(--line);border-radius:14px;padding:8px}
.map h2{font-size:14px;margin:2px 6px 0;color:var(--mut);font-weight:600}
.map svg{width:100%;height:auto;display:block}
.map text{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:3px}
.cards{display:grid;gap:14px;margin-top:18px}
.day{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:14px 16px}

.say{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.say p{margin:0;display:flex;gap:6px;align-items:center;background:var(--bg);padding:4px 10px 4px 4px;border-radius:999px;font-size:13.5px}
.say svg{width:26px;height:26px;flex:none}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
li b{color:var(--mut);font-weight:600;font-size:13px}
li small{display:block;color:var(--mut);font-size:12.5px}
.warn{margin:10px 0 0;padding:8px 12px;background:var(--warn);color:var(--warnink);border-radius:8px;font-size:13px}
body[data-skin="shiba"]{--bg:#fff6e8;--card:#fffdf8;--ink:#4a3426;--mut:#8a6e58;--line:#ecd5b8;--map:#fff9ee;--fuji:#e6d6c4;--warn:#ffe9c7;--warnink:#7a4a00}

body{background-image:radial-gradient(var(--line) 1.2px,transparent 1.4px);background-size:22px 22px}
h1,.day h3{font-family:"Hannotate TC","Yuppy TC","Kaiti TC","BiauKai","PingFang TC",cursive}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 0}
.bar button{font:inherit;font-size:13.5px;border:2px dashed var(--ink);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.bar button:focus-visible{outline:3px solid #2d7ff9;outline-offset:2px}
.clock{font-size:13.5px;padding:5px 12px;background:var(--card);border:2px solid var(--line);border-radius:999px}
.clock b{font-variant-numeric:tabular-nums}
.day{position:relative;border:2px dashed var(--line);border-left:6px solid var(--c)}
.day:nth-child(odd){transform:rotate(-.35deg)}.day:nth-child(even){transform:rotate(.35deg)}
.day::before{content:"";position:absolute;top:-9px;right:22px;width:68px;height:16px;background:var(--c);opacity:.55;transform:rotate(3deg);border-radius:2px}
.map{border:2px dashed var(--line)}
.map a{cursor:pointer}
.pin{text-decoration:none;margin-left:4px}
.note{margin:12px 2px 0;color:var(--mut);font-size:12.5px}
@media(prefers-reduced-motion:reduce){.day{transform:none!important}}
</style>

function mq(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q+' 日本')}
var skin=document.getElementById('skin'),pl=document.getElementById('play'),spb=document.getElementById('sp');
skin.onclick=function(){var p=document.body.dataset.skin=='poodle';document.body.dataset.skin=p?'shiba':'poodle';skin.textContent=p?'🖤 切換黑黑夜色版':'🧡 切換柴柴暖橘版'};
pl.onclick=function(){playing=!playing;pl.textContent=playing?'⏸ 暫停':'▶ 播放';document.querySelectorAll('.map svg').forEach(function(s){playing?s.unpauseAnimations():s.pauseAnimations()})};
spb.onclick=function(){spd=spd==4?1:spd*2;spb.textContent='×'+spd;draw('tk');draw('fj');applyPause()};
function tick(){var f=function(z){return new Date().toLocaleTimeString('zh-TW',{timeZone:z,hour12:false,hour:'2-digit',minute:'2-digit'})};document.getElementById('jp').textContent=f('Asia/Tokyo');document.getElementById('tw').textContent=f('Asia/Taipei')}
tick();setInterval(tick,15000);
if(reduce){pl.hidden=true;spb.hidden=true}
go();
</script>
</body>
</html>
